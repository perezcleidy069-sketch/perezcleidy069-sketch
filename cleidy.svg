<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" fill="none">
  <defs>
    <filter id="pink_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dot_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ANIMACIONES */
    @keyframes pulseCheck {
      0% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 8px #ff4da6); }
      100% { transform: scale(1); opacity: 0.85; }
    }

    @keyframes pulseDot {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ESTILOS DE TEXTO CLAROS Y LEGIBLES */
    .user-tag { font-family: 'Courier New', Courier, monospace; fill: #f0a3d4; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    .name { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; font-size: 44px; letter-spacing: -0.5px; }
    .role { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #ff99dd; font-size: 26px; }
    .skills-text { font-family: 'Courier New', Courier, monospace; fill: #f8c8e8; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
    .btn-text { font-family: 'Courier New', Courier, monospace; fill: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 1px; }

    /* CLASES DE ANIMACIÓN */
    .animated-check { animation: pulseCheck 3s ease-in-out infinite; transform-origin: 670px 95px; }
    .animated-dot { animation: pulseDot 2s ease-in-out infinite; transform-origin: 520px 207px; filter: url(#dot_glow); }
    .spinning-ring { animation: rotateRing 12s linear infinite; transform-origin: 670px 95px; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="#0d0914"/>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2a152e" stroke-width="0.6"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <g transform="translate(45, 42)">
    <text x="0" y="0" class="user-tag">perezcleidy069-sketch@github</text>
    <text x="0" y="48" class="name">Cleidy Pérez</text>
    <text x="0" y="86" class="role">Full Stack</text>
  </g>

  <line x1="45" y1="152" x2="755" y2="152" stroke="#3d1e42" stroke-width="1.5"/>

  <text x="45" y="183" class="skills-text">DESARROLLO WEB  |  BASE DE DATOS</text>

  <g class="animated-check">
    <circle cx="670" cy="95" r="54" fill="none" stroke="#ff33a6" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" class="spinning-ring"/>
    
    <circle cx="670" cy="95" r="44" fill="none" stroke="#ff33a6" stroke-width="4.5" filter="url(#pink_glow)"/>
    
    <path d="M 650 96 L 662 108 L 688 80" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(500, 192)">
    <rect x="0" y="0" width="255" height="30" rx="15" fill="#1b0b21" stroke="#ff33a6" stroke-width="1.2" opacity="0.9"/>
    
    <circle cx="20" cy="15" r="4.5" fill="#ff33a6" class="animated-dot"/>
    
    <text x="35" y="20" class="btn-text">CONSTRUYENDO SOLUCIONES</text>
  </g>
</svg>
